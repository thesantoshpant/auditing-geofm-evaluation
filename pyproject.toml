[project]
name = "auditing-geofm-evaluation"
version = "1.0.0"
description = "Evaluation audit of label proxies, baselines, and GeoFM adaptation for agricultural field-extent segmentation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Santosh Pant", email = "pantsantosh23@gmail.com" }]

dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "rasterio>=1.3",
    "shapely>=2.0",
    "geopandas>=0.14",
    "pyproj>=3.6",
    "torch>=2.2,<2.6",
    "torchvision>=0.17",
    # 0.7 keeps us compatible with claymodel==1.5.0 which pins einops<0.8.
    "einops>=0.7",
    "scikit-learn>=1.4",
    "scipy>=1.15,<1.18",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "wandb>=0.17",
    "rich>=13.7",
    "earthengine-api>=0.1.400",
    "huggingface-hub>=0.24",
    "matplotlib>=3.9,<3.11",
    "seaborn>=0.13",
    "pyarrow>=15",
]

[project.optional-dependencies]
# claymodel is not on PyPI; install from the Clay-foundation/model repo.
# Pinned to the upstream commit on main as of 2026-06-08 for reproducibility.
clay = ["claymodel @ git+https://github.com/Clay-foundation/model.git@f14e698f3c237cabf8d28dec669a362d66625381"]
# Version range covers the evaluated Terratorch environments used for the
# clean ten-seed headline grid. See data/results/environment.json for the
# captured runtime versions.
prithvi = ["terratorch>=0.99,<2.0", "timm>=1.0,<2.0"]
terramind = ["terratorch>=0.99,<2.0"]
# NOTE: anysat has no pyproject.toml/setup.py in the upstream repo - it is
# loaded at runtime via torch.hub.load("gastruc/anysat", ...). No pip install.
# torch.hub strips git metadata, so the exact commit at fetch time is NOT
# recoverable from the local cache. data/results/environment.json records the
# branch name and cache-fetch timestamp; that is the best provenance we can
# provide for AnySat. Byte-exact AnySat reproduction is not guaranteed.
#
# NOTE: presto pins earthengine-api==0.1.334 (Aug 2023) which conflicts with
# this project's GEE usage. It is intentionally excluded from [all] and
# would require a separate optional environment plus a chip-to-dataops adapter.
all = [
    "claymodel @ git+https://github.com/Clay-foundation/model.git@f14e698f3c237cabf8d28dec669a362d66625381",
    "terratorch>=0.99,<2.0",
    "timm>=1.0,<2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/thesantoshpant/auditing-geofm-evaluation"
Paper = "https://openreview.net/forum?id=qRXVTe1yYp"

[tool.hatch.build.targets.wheel]
packages = ["src/ftw_eval"]

# Required because several model extras pull from git+https URLs
# (claymodel, presto, anysat are not on PyPI).
[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires CUDA",
    "model_clay: requires claymodel installed",
    "model_prithvi: requires terratorch + Prithvi-EO-2.0 weights",
    "model_presto: requires presto installed (separate sub-env)",
    "model_anysat: AnySat loaded at runtime via torch.hub",
    "model_terramind: requires terratorch + TerraMind weights",
]
